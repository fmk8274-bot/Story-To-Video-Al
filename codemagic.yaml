workflows:
  android-build:
    name: Build Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 21
      node: 20
    scripts:
      - name: Setup and Build APK
        script: |
          mkdir -p temp_zip www
          unzip -o story-to-video-ai.zip -d temp_zip
          INDEX_DIR=$(find temp_zip -name "index.html" -exec dirname {} \; | head -n 1)
          cp -r "$INDEX_DIR"/* www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Story To Video" "com.storytovideo.ai" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk







